services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockroom
      POSTGRES_PASSWORD: stockroom
      POSTGRES_DB: stockroom
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stockroom -d stockroom']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The platform injects DATABASE_URL from its secret; the compose default
      # only covers a local `docker compose up` against the bundled db service.
      DATABASE_URL: ${DATABASE_URL:-postgresql://stockroom:stockroom@db:5432/stockroom}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      PORT: '3001'
      NODE_ENV: production
      # Object storage. Absent values are not an error: MinIO reports itself
      # as unconfigured on Admin > Settings and no other feature is affected.
      # The platform publishes the credentials as MINIO_ROOT_USER /
      # MINIO_ROOT_PASSWORD — see .env.example for the mapping.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-stockroom}
    ports:
      - '3001:3001'
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://127.0.0.1:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - '8080:80'

volumes:
  postgres_data:
